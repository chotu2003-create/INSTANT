<!DOCTYPE html>
<html>
<head>
<title>INSTANT - Home</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<div class="max-w-[500px] mx-auto border-x border-zinc-800 min-h-screen">
<div class="flex justify-between items-center p-4 border-b border-zinc-800 sticky top-0 bg-black">
<h1 class="text-2xl font-bold" style="font-family:cursive">INSTANT</h1>
<button onclick="logout()" class="text-sm bg-zinc-800 px-3 py-1 rounded">Logout</button>
</div>
<div class="p-3 border-b border-zinc-800">
<textarea id="caption" placeholder="What's on your mind?" class="w-full bg-zinc-900 p-3 rounded-lg text-sm"></textarea>
<input id="imgurl" placeholder="Image URL (optional)" class="w-full bg-zinc-900 p-2 rounded mt-2 text-sm">
<button onclick="post()" class="w-full bg-blue-600 mt-2 py-2 rounded font-bold">Post</button>
</div>
<div id="feed"></div>
</div>
<script>
if(!localStorage.getItem('instant_logged')) location.href='index.html';
function logout(){localStorage.removeItem('instant_logged');location.href='index.html'}
let posts=JSON.parse(localStorage.getItem('instant_posts')||'[]');
function render(){
 feed.innerHTML='';
 posts.slice().reverse().forEach((p,i)=>{
   feed.innerHTML+=`<div class='border-b border-zinc-800'><div class='p-3 flex gap-2 items-center'><div class='w-8 h-8 bg-zinc-700 rounded-full'></div><b class='text-sm'>${p.user}</b></div>${p.img?`<img src='${p.img}' class='w-full'>`:''}<div class='p-3 text-sm'>${p.cap}</div><div class='px-3 pb-3 flex gap-4 text-sm text-zinc-400'><span onclick='like(${posts.length-1-i})'>❤️ ${p.likes} Likes</span></div></div>`;
 });
}
function post(){
 let cap=caption.value, img=imgurl.value;
 if(!cap) return alert('Caption likh');
 posts.push({user:localStorage.getItem('instant_logged'),cap,img,likes:0});
 localStorage.setItem('instant_posts',JSON.stringify(posts));
 caption.value=''; imgurl.value=''; render();
}
function like(i){ posts[i].likes++; localStorage.setItem('instant_posts',JSON.stringify(posts)); render();}
render();
</script>
</body>
</html>
