<!DOCTYPE html>
<html>
<head>
<title>INSTANT - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">
<div class="border border-zinc-800 p-8 w-[350px] rounded-xl">
<h1 class="text-3xl font-bold mb-6">INSTANT</h1>
<input id="username" placeholder="Username" class="w-full p-3 mb-3 bg-zinc-900 border border-zinc-800 rounded">
<input id="password" type="password" placeholder="Password" class="w-full p-3 mb-3 bg-zinc-900 border border-zinc-800 rounded">
<button onclick="signup()" class="w-full bg-blue-600 p-3 rounded mb-2 font-bold">Create New ID</button>
<button onclick="login()" class="w-full bg-zinc-800 p-3 rounded font-bold">Login</button>
<p id="msg" class="text-sm mt-3 text-green-400"></p>
</div>
<script>
function signup(){
 let u=document.getElementById('username').value.trim();
 let p=document.getElementById('password').value.trim();
 if(!u||!p){ document.getElementById('msg').innerText="Username password bhar!"; return; }
 let users=JSON.parse(localStorage.getItem('insta_users')||'[]');
 if(users.find(x=>x.u===u)){ document.getElementById('msg').innerText="Ye ID pehle se hai, Login dabao"; return; }
 users.push({u,p}); localStorage.setItem('insta_users', JSON.stringify(users));
 document.getElementById('msg').innerText="ID ban gayi! Ab Login daba";
}
function login(){
 let u=document.getElementById('username').value.trim();
 let p=document.getElementById('password').value.trim();
 let users=JSON.parse(localStorage.getItem('insta_users')||'[]');
 console.log(users);
 if(users.find(x=>x.u===u && x.p===p)){
   localStorage.setItem('insta_current', u);
   window.location.href="home.html";
 } else {
   document.getElementById('msg').innerText="Pehle Create New ID daba, fir Login";
 }
}
</script>
</body>
</html>
